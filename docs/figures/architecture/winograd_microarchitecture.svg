<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1360" height="620" fill="#ffffff"/>
  <defs>
    <marker id="dat" markerWidth="10" markerHeight="10" refX="7.6" refY="3.4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7.6,3.4 L0,6.8 Z" fill="#1a1a1a"/></marker>
    <marker id="ctl" markerWidth="8" markerHeight="8" refX="6" refY="2.8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,2.8 L0,5.6 Z" fill="#8a8a8a"/></marker>
  </defs>

  <!-- ============ external weight/parameter interface ============ -->
  <rect x="596" y="10" width="352" height="34" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="772" y="31" text-anchor="middle" font-size="11" fill="#1a1a1a">Weight / parameter interface (external)</text>

  <!-- ============ accelerator boundary ============ -->
  <rect x="22" y="56" width="1316" height="512" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="32" y="72" font-size="11.5" fill="#1a1a1a" font-weight="bold">Winograd CNN Accelerator</text>

  <!-- ============ Layer FSM / controller ============ -->
  <rect x="38" y="88" width="150" height="50" fill="#ffffff" stroke="#555" stroke-width="1.2"/>
  <text x="113" y="108" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Layer FSM /</text>
  <text x="113" y="122" text-anchor="middle" font-size="10.5" fill="#1a1a1a">controller</text>
  <text x="196" y="160" font-size="8.5" fill="#8a8a8a" font-style="italic">control / ready–valid</text>

  <!-- ============ operation-fused Winograd core boundary ============ -->
  <rect x="304" y="174" width="730" height="160" fill="none" stroke="#4a6a8a" stroke-width="1.3" stroke-dasharray="1 0"/>
  <text x="312" y="189" font-size="10.5" fill="#3b5f80" font-weight="bold">Operation-fused Winograd Core</text>

  <!-- ============ pixel input ============ -->
  <text x="30" y="246" font-size="9" fill="#1a1a1a">pixel</text>
  <text x="30" y="258" font-size="8.5" fill="#666">UINT8</text>
  <line x1="30" y1="270" x2="62" y2="270" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>

  <!-- ============ Sliding-window generator ============ -->
  <rect x="62" y="196" width="182" height="128" fill="#eef1f4" stroke="#7a7a7e" stroke-width="1.2"/>
  <text x="153" y="212" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Sliding-window generator</text>
  <!-- 3 line buffers -->
  <g fill="#dcdfe3" stroke="#8a8a8e" stroke-width="0.8">
    <rect x="74" y="226" width="110" height="12"/><rect x="74" y="242" width="110" height="12"/><rect x="74" y="258" width="110" height="12"/>
  </g>
  <g stroke="#b7bcc2" stroke-width="0.6">
    <line x1="88" y1="226" x2="88" y2="270"/><line x1="102" y1="226" x2="102" y2="270"/><line x1="116" y1="226" x2="116" y2="270"/>
    <line x1="130" y1="226" x2="130" y2="270"/><line x1="144" y1="226" x2="144" y2="270"/><line x1="158" y1="226" x2="158" y2="270"/><line x1="170" y1="226" x2="170" y2="270"/>
  </g>
  <text x="129" y="286" text-anchor="middle" font-size="8" fill="#666">line buffer ×3</text>
  <!-- 4x4 window register -->
  <g fill="#dcdfe3" stroke="#8a8a8e" stroke-width="0.8">
    <rect x="196" y="226" width="40" height="40"/>
  </g>
  <g stroke="#b7bcc2" stroke-width="0.6">
    <line x1="206" y1="226" x2="206" y2="266"/><line x1="216" y1="226" x2="216" y2="266"/><line x1="226" y1="226" x2="226" y2="266"/>
    <line x1="196" y1="236" x2="236" y2="236"/><line x1="196" y1="246" x2="236" y2="246"/><line x1="196" y1="256" x2="236" y2="256"/>
  </g>
  <text x="216" y="286" text-anchor="middle" font-size="8" fill="#666">4×4 window</text>
  <line x1="184" y1="248" x2="196" y2="248" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#dat)"/>

  <!-- ============ Tile FIFO (stacked queue D=2) ============ -->
  <g fill="#e8e8ea" stroke="#7a7a7e" stroke-width="1">
    <rect x="258" y="238" width="34" height="18"/><rect x="258" y="256" width="34" height="18"/>
  </g>
  <text x="275" y="284" text-anchor="middle" font-size="8.5" fill="#1a1a1a">Tile FIFO</text>
  <text x="275" y="295" text-anchor="middle" font-size="8" fill="#666">D=2</text>

  <!-- ============ Input transform (butterfly) ============ -->
  <rect x="316" y="200" width="120" height="120" fill="#dfe8f2" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="376" y="216" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Input transform</text>
  <!-- butterfly -->
  <g stroke="#3b5f80" stroke-width="1" fill="none">
    <line x1="330" y1="238" x2="422" y2="238"/><line x1="330" y1="258" x2="422" y2="258"/>
    <line x1="330" y1="278" x2="422" y2="278"/><line x1="330" y1="298" x2="422" y2="298"/>
    <line x1="330" y1="238" x2="422" y2="278"/><line x1="330" y1="278" x2="422" y2="238"/>
    <line x1="330" y1="258" x2="422" y2="298"/><line x1="330" y1="298" x2="422" y2="258"/>
  </g>
  <g fill="#3b5f80"><circle cx="330" cy="238" r="2.4"/><circle cx="330" cy="258" r="2.4"/><circle cx="330" cy="278" r="2.4"/><circle cx="330" cy="298" r="2.4"/>
    <circle cx="422" cy="238" r="2.4"/><circle cx="422" cy="258" r="2.4"/><circle cx="422" cy="278" r="2.4"/><circle cx="422" cy="298" r="2.4"/></g>
  <text x="376" y="313" text-anchor="middle" font-size="8" fill="#3b5f80">add / sub butterfly</text>

  <!-- ============ V-replay FIFO ============ -->
  <g fill="#e8e8ea" stroke="#7a7a7e" stroke-width="1">
    <rect x="450" y="238" width="34" height="18"/><rect x="450" y="256" width="34" height="18"/>
  </g>
  <text x="467" y="284" text-anchor="middle" font-size="8.5" fill="#1a1a1a">V-replay FIFO</text>
  <text x="467" y="295" text-anchor="middle" font-size="8" fill="#666">D=2</text>

  <!-- ============ 16-lane MAC / reduction array (4x4) ============ -->
  <rect x="500" y="196" width="176" height="128" fill="#dfe8f2" stroke="#4a6a8a" stroke-width="1.3"/>
  <text x="588" y="212" text-anchor="middle" font-size="10.5" fill="#1a1a1a">16-lane MAC / reduction array</text>
  <!-- 16 lanes 4x4 ; 0-9 active, 10-15 gated in FC -->
  <g font-size="8" text-anchor="middle">
    <!-- row0: 0-3 -->
    <rect x="512" y="222" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="530" y="236" fill="#1a3350">0</text>
    <rect x="550" y="222" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="568" y="236" fill="#1a3350">1</text>
    <rect x="588" y="222" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="606" y="236" fill="#1a3350">2</text>
    <rect x="626" y="222" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="644" y="236" fill="#1a3350">3</text>
    <!-- row1: 4-7 -->
    <rect x="512" y="244" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="530" y="258" fill="#1a3350">4</text>
    <rect x="550" y="244" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="568" y="258" fill="#1a3350">5</text>
    <rect x="588" y="244" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="606" y="258" fill="#1a3350">6</text>
    <rect x="626" y="244" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="644" y="258" fill="#1a3350">7</text>
    <!-- row2: 8,9 active ; 10,11 gated -->
    <rect x="512" y="266" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="530" y="280" fill="#1a3350">8</text>
    <rect x="550" y="266" width="36" height="20" fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8"/><text x="568" y="280" fill="#1a3350">9</text>
    <rect x="588" y="266" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="606" y="280" fill="#8a97a4">10</text>
    <rect x="626" y="266" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="644" y="280" fill="#8a97a4">11</text>
    <!-- row3: 12-15 gated -->
    <rect x="512" y="288" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="530" y="302" fill="#8a97a4">12</text>
    <rect x="550" y="288" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="568" y="302" fill="#8a97a4">13</text>
    <rect x="588" y="288" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="606" y="302" fill="#8a97a4">14</text>
    <rect x="626" y="288" width="36" height="20" fill="#eef1f4" stroke="#8aa0b4" stroke-width="0.8" stroke-dasharray="2 1.6"/><text x="644" y="302" fill="#8a97a4">15</text>
  </g>
  <text x="588" y="320" text-anchor="middle" font-size="8" fill="#3b5f80">Conv: lane 0–15 · FC: lane 0–9 active, 10–15 gated</text>

  <!-- ============ M FIFO ============ -->
  <g fill="#e8e8ea" stroke="#7a7a7e" stroke-width="1">
    <rect x="690" y="247" width="34" height="18"/>
  </g>
  <text x="707" y="284" text-anchor="middle" font-size="8.5" fill="#1a1a1a">M FIFO</text>
  <text x="707" y="295" text-anchor="middle" font-size="8" fill="#666">D=1</text>

  <!-- ============ Output transform (butterfly) ============ -->
  <rect x="738" y="200" width="120" height="120" fill="#dfe8f2" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="798" y="216" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Output transform</text>
  <g stroke="#3b5f80" stroke-width="1" fill="none">
    <line x1="752" y1="238" x2="844" y2="238"/><line x1="752" y1="258" x2="844" y2="258"/>
    <line x1="752" y1="278" x2="844" y2="278"/><line x1="752" y1="298" x2="844" y2="298"/>
    <line x1="752" y1="238" x2="844" y2="278"/><line x1="752" y1="278" x2="844" y2="238"/>
    <line x1="752" y1="258" x2="844" y2="298"/><line x1="752" y1="298" x2="844" y2="258"/>
  </g>
  <g fill="#3b5f80"><circle cx="752" cy="238" r="2.4"/><circle cx="752" cy="258" r="2.4"/><circle cx="752" cy="278" r="2.4"/><circle cx="752" cy="298" r="2.4"/>
    <circle cx="844" cy="238" r="2.4"/><circle cx="844" cy="258" r="2.4"/><circle cx="844" cy="278" r="2.4"/><circle cx="844" cy="298" r="2.4"/></g>
  <text x="798" y="313" text-anchor="middle" font-size="8" fill="#3b5f80">add / sub butterfly</text>

  <!-- ============ Fused postprocess ============ -->
  <rect x="872" y="200" width="150" height="120" fill="#dfe8f2" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="947" y="216" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Fused postprocess</text>
  <g fill="#c7d7e8" stroke="#4a6a8a" stroke-width="0.8">
    <rect x="884" y="238" width="126" height="16"/><rect x="884" y="258" width="126" height="16"/><rect x="884" y="278" width="126" height="16"/><rect x="884" y="298" width="126" height="16"/>
  </g>
  <g font-size="8" text-anchor="middle" fill="#1a3350">
    <text x="947" y="250">bias add</text><text x="947" y="270">ReLU</text><text x="947" y="290">max-pool</text><text x="947" y="310">requant → UINT8</text>
  </g>

  <!-- ============ pipeline data arrows (thick) ============ -->
  <g stroke="#1a1a1a" stroke-width="2.2" fill="none">
    <line x1="244" y1="248" x2="258" y2="248" marker-end="url(#dat)"/>
    <line x1="292" y1="248" x2="316" y2="248" marker-end="url(#dat)"/>
    <line x1="436" y1="248" x2="450" y2="248" marker-end="url(#dat)"/>
    <line x1="484" y1="248" x2="500" y2="248" marker-end="url(#dat)"/>
    <line x1="676" y1="252" x2="690" y2="252" marker-end="url(#dat)"/>
    <line x1="724" y1="252" x2="738" y2="248" marker-end="url(#dat)"/>
    <line x1="858" y1="248" x2="872" y2="248" marker-end="url(#dat)"/>
  </g>
  <text x="684" y="242" text-anchor="middle" font-size="8.5" fill="#3b5f80">INT18</text>

  <!-- ============ activation scratchpad (104 x 24-bit FF array) ============ -->
  <rect x="304" y="378" width="720" height="96" fill="#eef1f4" stroke="#7a7a7e" stroke-width="1.3"/>
  <text x="314" y="394" font-size="10.5" fill="#1a1a1a" font-weight="bold">Activation scratchpad</text>
  <text x="454" y="394" font-size="9" fill="#666">104 × 24-bit FF register array</text>
  <!-- register array grid 26 x 3 (schematic) -->
  <g fill="#dcdfe3" stroke="#9aa0a6" stroke-width="0.5">
    <rect x="330" y="404" width="676" height="60"/>
  </g>
  <g stroke="#b7bcc2" stroke-width="0.5">
    <line x1="330" y1="424" x2="1006" y2="424"/><line x1="330" y1="444" x2="1006" y2="444"/>
    <line x1="356" y1="404" x2="356" y2="464"/><line x1="382" y1="404" x2="382" y2="464"/><line x1="408" y1="404" x2="408" y2="464"/><line x1="434" y1="404" x2="434" y2="464"/><line x1="460" y1="404" x2="460" y2="464"/><line x1="486" y1="404" x2="486" y2="464"/><line x1="512" y1="404" x2="512" y2="464"/><line x1="538" y1="404" x2="538" y2="464"/><line x1="564" y1="404" x2="564" y2="464"/><line x1="590" y1="404" x2="590" y2="464"/><line x1="616" y1="404" x2="616" y2="464"/><line x1="642" y1="404" x2="642" y2="464"/><line x1="668" y1="404" x2="668" y2="464"/><line x1="694" y1="404" x2="694" y2="464"/><line x1="720" y1="404" x2="720" y2="464"/><line x1="746" y1="404" x2="746" y2="464"/><line x1="772" y1="404" x2="772" y2="464"/><line x1="798" y1="404" x2="798" y2="464"/><line x1="824" y1="404" x2="824" y2="464"/><line x1="850" y1="404" x2="850" y2="464"/><line x1="876" y1="404" x2="876" y2="464"/><line x1="902" y1="404" x2="902" y2="464"/><line x1="928" y1="404" x2="928" y2="464"/><line x1="954" y1="404" x2="954" y2="464"/><line x1="980" y1="404" x2="980" y2="464"/>
  </g>
  <text x="343" y="480" font-size="7.5" fill="#888">addr 0</text>
  <text x="1006" y="480" text-anchor="end" font-size="7.5" fill="#888">addr 103</text>

  <!-- ============ Pipelined Argmax ============ -->
  <rect x="1120" y="392" width="176" height="60" fill="#dfe8f2" stroke="#4a6a8a" stroke-width="1.2"/>
  <text x="1208" y="418" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Pipelined Argmax</text>
  <text x="1208" y="432" text-anchor="middle" font-size="8" fill="#3b5f80">10-class</text>

  <!-- ============ scratchpad data connectors (thick) ============ -->
  <!-- store: postprocess -> scratchpad -->
  <line x1="947" y1="320" x2="947" y2="378" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>
  <text x="953" y="352" font-size="8.5" fill="#1a1a1a">store</text>
  <!-- read: scratchpad -> window gen -->
  <path d="M360,378 L360,350 L152,350 L152,324" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>
  <text x="250" y="345" font-size="8.5" fill="#1a1a1a">read (Conv2)</text>
  <!-- FC mode read: scratchpad -> MAC -->
  <line x1="560" y1="378" x2="560" y2="324" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>
  <text x="566" y="352" font-size="8.5" fill="#1a1a1a">FC mode</text>
  <!-- FC result: MAC -> Argmax -->
  <path d="M632,324 L632,358 L1208,358 L1208,392" fill="none" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>
  <text x="920" y="352" text-anchor="middle" font-size="8.5" fill="#1a1a1a">FC result</text>
  <!-- decision out -->
  <line x1="1296" y1="422" x2="1344" y2="422" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#dat)"/>
  <text x="1300" y="414" font-size="8.5" fill="#1a1a1a">decision · 4b</text>

  <!-- ============ weight/param connections (from external, thick) ============ -->
  <line x1="660" y1="44" x2="660" y2="196" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#dat)"/>
  <text x="666" y="120" font-size="8.5" fill="#1a1a1a">U / FC weight · INT4</text>
  <line x1="900" y1="44" x2="900" y2="200" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#dat)"/>
  <text x="906" y="120" font-size="8.5" fill="#1a1a1a">bias / requant param</text>

  <!-- ============ control paths (thin dashed, from FSM) ============ -->
  <g stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <path d="M113,138 L113,168 L1250,168"/>
    <line x1="153" y1="168" x2="153" y2="196" marker-end="url(#ctl)"/>
    <line x1="376" y1="168" x2="376" y2="200" marker-end="url(#ctl)"/>
    <line x1="588" y1="168" x2="588" y2="196" marker-end="url(#ctl)"/>
    <line x1="798" y1="168" x2="798" y2="200" marker-end="url(#ctl)"/>
    <line x1="990" y1="168" x2="990" y2="200" marker-end="url(#ctl)"/>
    <line x1="298" y1="168" x2="298" y2="378" marker-end="url(#ctl)"/>
    <line x1="1250" y1="168" x2="1250" y2="392" marker-end="url(#ctl)"/>
  </g>
</svg>
