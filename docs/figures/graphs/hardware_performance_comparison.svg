<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <title>Hardware performance comparison</title>
  <desc>Six publication-style bar charts comparing the baseline and proposed design in frequency, power, throughput, energy efficiency, latency, and area.</desc>
  <style>
    text { font-family: Arial, "Noto Sans KR", sans-serif; fill: #111111; font-size: 15px; }
    .tick { font-size: 13px; }
    .value { font-size: 13px; font-weight: 700; }
    .delta { font-size: 13px; font-weight: 700; fill: #3F6F9F; }
    .axis { stroke: #111111; stroke-width: 1; }
    .grid { stroke: #D8D8D8; stroke-width: 0.8; }
    .baseline { fill: #A8A8A8; }
    .proposed { fill: #3F6F9F; }
    .caption { font-size: 15px; font-weight: 700; text-anchor: middle; }
  </style>

  <!-- Panel (a): frequency -->
  <line class="grid" x1="90" y1="290" x2="430" y2="290"/><line class="grid" x1="90" y1="225" x2="430" y2="225"/><line class="grid" x1="90" y1="160" x2="430" y2="160"/><line class="grid" x1="90" y1="95" x2="430" y2="95"/><line class="grid" x1="90" y1="30" x2="430" y2="30"/>
  <line class="axis" x1="90" y1="30" x2="90" y2="290"/><line class="axis" x1="90" y1="290" x2="430" y2="290"/>
  <text class="tick" x="80" y="295" text-anchor="end">0</text><text class="tick" x="80" y="230" text-anchor="end">300</text><text class="tick" x="80" y="165" text-anchor="end">600</text><text class="tick" x="80" y="100" text-anchor="end">900</text><text class="tick" x="80" y="35" text-anchor="end">1,200</text>
  <text x="28" y="160" text-anchor="middle" transform="rotate(-90 28 160)">Frequency (MHz)</text>
  <rect class="baseline" x="150" y="186.87" width="82" height="103.13"/><rect class="proposed" x="290" y="73.33" width="82" height="216.67"/>
  <text class="value" x="191" y="178" text-anchor="middle">476</text><text class="value" x="331" y="64" text-anchor="middle">1,000</text>
  <text class="delta" x="331" y="45" text-anchor="middle">+110.1%</text>
  <text class="tick" x="191" y="313" text-anchor="middle">Baseline</text><text class="tick" x="331" y="313" text-anchor="middle">Proposed</text>
  <text class="caption" x="260" y="350">(a) Operating frequency</text>

  <!-- Panel (b): power -->
  <line class="grid" x1="580" y1="290" x2="920" y2="290"/><line class="grid" x1="580" y1="225" x2="920" y2="225"/><line class="grid" x1="580" y1="160" x2="920" y2="160"/><line class="grid" x1="580" y1="95" x2="920" y2="95"/><line class="grid" x1="580" y1="30" x2="920" y2="30"/>
  <line class="axis" x1="580" y1="30" x2="580" y2="290"/><line class="axis" x1="580" y1="290" x2="920" y2="290"/>
  <text class="tick" x="570" y="295" text-anchor="end">0</text><text class="tick" x="570" y="230" text-anchor="end">100</text><text class="tick" x="570" y="165" text-anchor="end">200</text><text class="tick" x="570" y="100" text-anchor="end">300</text><text class="tick" x="570" y="35" text-anchor="end">400</text>
  <text x="518" y="160" text-anchor="middle" transform="rotate(-90 518 160)">Power (mW)</text>
  <rect class="baseline" x="640" y="72.25" width="82" height="217.75"/><rect class="proposed" x="780" y="279.21" width="82" height="10.79"/>
  <text class="value" x="681" y="63" text-anchor="middle">335</text><text class="value" x="821" y="270" text-anchor="middle">16.60</text>
  <text class="delta" x="821" y="250" text-anchor="middle">−95.0%</text>
  <text class="tick" x="681" y="313" text-anchor="middle">Baseline</text><text class="tick" x="821" y="313" text-anchor="middle">Proposed</text>
  <text class="caption" x="750" y="350">(b) Power</text>

  <!-- Panel (c): throughput -->
  <line class="grid" x1="1070" y1="290" x2="1410" y2="290"/><line class="grid" x1="1070" y1="225" x2="1410" y2="225"/><line class="grid" x1="1070" y1="160" x2="1410" y2="160"/><line class="grid" x1="1070" y1="95" x2="1410" y2="95"/><line class="grid" x1="1070" y1="30" x2="1410" y2="30"/>
  <line class="axis" x1="1070" y1="30" x2="1070" y2="290"/><line class="axis" x1="1070" y1="290" x2="1410" y2="290"/>
  <text class="tick" x="1060" y="295" text-anchor="end">0</text><text class="tick" x="1060" y="230" text-anchor="end">0.1</text><text class="tick" x="1060" y="165" text-anchor="end">0.2</text><text class="tick" x="1060" y="100" text-anchor="end">0.3</text><text class="tick" x="1060" y="35" text-anchor="end">0.4</text>
  <text x="1008" y="160" text-anchor="middle" transform="rotate(-90 1008 160)">Throughput (TOPS)</text>
  <rect class="baseline" x="1130" y="74.66" width="82" height="215.34"/><rect class="proposed" x="1270" y="52.10" width="82" height="237.90"/>
  <text class="value" x="1171" y="65" text-anchor="middle">0.331</text><text class="value" x="1311" y="43" text-anchor="middle">0.366</text>
  <text class="delta" x="1311" y="22" text-anchor="middle">+10.5%</text>
  <text class="tick" x="1171" y="313" text-anchor="middle">Baseline</text><text class="tick" x="1311" y="313" text-anchor="middle">Proposed</text>
  <text class="caption" x="1240" y="350">(c) Dense-equivalent throughput</text>

  <!-- Panel (d): TOPS/W -->
  <line class="grid" x1="90" y1="660" x2="430" y2="660"/><line class="grid" x1="90" y1="608" x2="430" y2="608"/><line class="grid" x1="90" y1="556" x2="430" y2="556"/><line class="grid" x1="90" y1="504" x2="430" y2="504"/><line class="grid" x1="90" y1="452" x2="430" y2="452"/><line class="grid" x1="90" y1="400" x2="430" y2="400"/>
  <line class="axis" x1="90" y1="400" x2="90" y2="660"/><line class="axis" x1="90" y1="660" x2="430" y2="660"/>
  <text class="tick" x="80" y="665" text-anchor="end">0</text><text class="tick" x="80" y="613" text-anchor="end">5</text><text class="tick" x="80" y="561" text-anchor="end">10</text><text class="tick" x="80" y="509" text-anchor="end">15</text><text class="tick" x="80" y="457" text-anchor="end">20</text><text class="tick" x="80" y="405" text-anchor="end">25</text>
  <text x="28" y="530" text-anchor="middle" transform="rotate(-90 28 530)">Energy efficiency (TOPS/W)</text>
  <rect class="baseline" x="150" y="649.71" width="82" height="10.29"/><rect class="proposed" x="290" y="430.66" width="82" height="229.34"/>
  <text class="value" x="191" y="640" text-anchor="middle">0.989</text><text class="value" x="331" y="421" text-anchor="middle">22.05</text>
  <text class="delta" x="331" y="389" text-anchor="middle">+2,130%</text>
  <text class="tick" x="191" y="683" text-anchor="middle">Baseline</text><text class="tick" x="331" y="683" text-anchor="middle">Proposed</text>
  <text class="caption" x="260" y="720">(d) Dense-equivalent energy efficiency</text>

  <!-- Panel (e): latency -->
  <line class="grid" x1="580" y1="660" x2="920" y2="660"/><line class="grid" x1="580" y1="608" x2="920" y2="608"/><line class="grid" x1="580" y1="556" x2="920" y2="556"/><line class="grid" x1="580" y1="504" x2="920" y2="504"/><line class="grid" x1="580" y1="452" x2="920" y2="452"/><line class="grid" x1="580" y1="400" x2="920" y2="400"/>
  <line class="axis" x1="580" y1="400" x2="580" y2="660"/><line class="axis" x1="580" y1="660" x2="920" y2="660"/>
  <text class="tick" x="570" y="665" text-anchor="end">0</text><text class="tick" x="570" y="613" text-anchor="end">0.6</text><text class="tick" x="570" y="561" text-anchor="end">1.2</text><text class="tick" x="570" y="509" text-anchor="end">1.8</text><text class="tick" x="570" y="457" text-anchor="end">2.4</text><text class="tick" x="570" y="405" text-anchor="end">3.0</text>
  <text x="518" y="530" text-anchor="middle" transform="rotate(-90 518 530)">Latency (µs)</text>
  <rect class="baseline" x="640" y="417.33" width="82" height="242.67"/><rect class="proposed" x="780" y="554.27" width="82" height="105.73"/>
  <text class="value" x="681" y="408" text-anchor="middle">2.80</text><text class="value" x="821" y="545" text-anchor="middle">1.220</text>
  <text class="delta" x="821" y="525" text-anchor="middle">−56.4%</text>
  <text class="tick" x="681" y="683" text-anchor="middle">Baseline</text><text class="tick" x="821" y="683" text-anchor="middle">Proposed</text>
  <text class="caption" x="750" y="720">(e) Inference latency</text>

  <!-- Panel (f): area -->
  <line class="grid" x1="1070" y1="660" x2="1410" y2="660"/><line class="grid" x1="1070" y1="608" x2="1410" y2="608"/><line class="grid" x1="1070" y1="556" x2="1410" y2="556"/><line class="grid" x1="1070" y1="504" x2="1410" y2="504"/><line class="grid" x1="1070" y1="452" x2="1410" y2="452"/><line class="grid" x1="1070" y1="400" x2="1410" y2="400"/>
  <line class="axis" x1="1070" y1="400" x2="1070" y2="660"/><line class="axis" x1="1070" y1="660" x2="1410" y2="660"/>
  <text class="tick" x="1060" y="665" text-anchor="end">0</text><text class="tick" x="1060" y="613" text-anchor="end">0.006</text><text class="tick" x="1060" y="561" text-anchor="end">0.012</text><text class="tick" x="1060" y="509" text-anchor="end">0.018</text><text class="tick" x="1060" y="457" text-anchor="end">0.024</text><text class="tick" x="1060" y="405" text-anchor="end">0.030</text>
  <text x="1008" y="530" text-anchor="middle" transform="rotate(-90 1008 530)">Cell area (mm²)</text>
  <rect class="baseline" x="1130" y="444.68" width="82" height="215.32"/><rect class="proposed" x="1270" y="591.07" width="82" height="68.93"/>
  <text class="value" x="1171" y="435" text-anchor="middle">0.024848</text><text class="value" x="1311" y="582" text-anchor="middle">0.007954</text>
  <text class="delta" x="1311" y="562" text-anchor="middle">−68.0%</text>
  <text class="tick" x="1171" y="683" text-anchor="middle">Baseline</text><text class="tick" x="1311" y="683" text-anchor="middle">Proposed</text>
  <text class="caption" x="1240" y="720">(f) Cell area</text>
</svg>
